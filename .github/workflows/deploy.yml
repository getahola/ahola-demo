name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Serve from /<repo>/ so asset URLs resolve on the project Pages site.
        # VITE_APP_PASSWORD_HASH is a SHA-256 hash from a repo secret, so neither
        # the source nor the shipped bundle contains the plaintext password.
        # (Reminder: a client-side gate is still not real security.)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APP_PASSWORD_HASH: ${{ secrets.APP_PASSWORD_HASH }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
